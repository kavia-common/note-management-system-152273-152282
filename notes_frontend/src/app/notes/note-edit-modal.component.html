<div class="modal-overlay">
  <div class="modal">
    <h2>{{ note ? 'Edit Note' : 'New Note' }}</h2>
    <form (ngSubmit)="onSave()" #noteForm="ngForm">
      <label>
        Title:
        <input type="text" [(ngModel)]="title" name="title" required maxlength="80"/>
      </label>
      <label>
        Content:
        <textarea [(ngModel)]="content" name="content" required rows="5"></textarea>
      </label>
      <div class="modal-actions">
        <button type="button" class="cancel-btn" (click)="close.emit()">Cancel</button>
        <button type="submit" class="save-btn" [disabled]="!title.trim() || !content.trim()">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
