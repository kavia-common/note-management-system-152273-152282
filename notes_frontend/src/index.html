<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NoteLite</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Material+Symbols+Outlined" rel="stylesheet">
  <script>
    // Detect Supabase credentials from possible runtime env injection.
    function extractSupabaseEnvVar(name) {
      if (window.env && typeof window.env[name] !== "undefined") return window.env[name];
      if (typeof window[name] !== "undefined") return window[name];
      // Try to read directly from injected <meta> tags (Netlify/Vercel pattern)
      const meta = document.querySelector('meta[name="' + name + '"]');
      if (meta && meta.content) return meta.content;
      return '';
    }
    window.NG_APP_SUPABASE_URL = extractSupabaseEnvVar('NG_APP_SUPABASE_URL');
    window.NG_APP_SUPABASE_KEY = extractSupabaseEnvVar('NG_APP_SUPABASE_KEY');
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
